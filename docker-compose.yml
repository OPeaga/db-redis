name: projeto-cache

services:
  redis:
    image: redis:7.4-alpine
    container_name: projeto-cache-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-insight:
    image: redis/redisinsight:latest
    container_name: projeto-cache-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    environment:
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=DistriCommerce
    volumes:
      - redisinsightdata:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:
  redisinsightdata:
